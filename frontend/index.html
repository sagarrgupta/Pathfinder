<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathfinder - Academic Guidance AI Assistant</title>
    <meta name="description" content="Pathfinder - Your personal academic guidance assistant. Get help with university selection, major recommendations, and career planning." />
    <script>
      // Prevent FOUC: apply dark mode before first paint
      (function() {
        try {
          var theme = JSON.parse(localStorage.getItem('pathfinder_state'))?.theme;
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

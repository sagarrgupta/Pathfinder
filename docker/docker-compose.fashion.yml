# Separate project and volumes; never mount the student database volumes here.
services:
  neo4j:
    image: neo4j:5-community
    container_name: pathfinder-fashion-neo4j
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Use start-fashion-demo.sh}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - fashion_neo4j_data:/data
      - fashion_neo4j_logs:/logs
    restart: unless-stopped

volumes:
  fashion_neo4j_data:
  fashion_neo4j_logs:
